# prometheus.yml
global:
  scrape_interval: 15s         # how often to scrape metrics
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'todo-svc'
    static_configs:
      - targets: ['api:5000']  # service name & port in Docker Compose
    metrics_path: /metrics     # our Flask app’s metrics endpoint

  - job_name: 'opa'
    static_configs:
      - targets: ['opa:8181']  # if you want to scrape OPA’s own metrics (if enabled)

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
